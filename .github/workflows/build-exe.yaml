name: Build EXE

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, arm64]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set artifact version
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            "1.1.0-ci.$env:GITHUB_RUN_NUMBER"
          }
          "ARTIFACT_VERSION=$version" >> $env:GITHUB_ENV

      - name: Restore
        run: msbuild -v:m -nologo -p:Configuration=Release -p:Platform=${{ matrix.platform }} -t:restore

      - name: Publish
        run: >
          msbuild -v:m -nologo
          -p:Configuration=Release
          -p:Platform=${{ matrix.platform }}
          -p:RuntimeIdentifier=win-${{ matrix.platform }}
          -p:PublishDir=${{ github.workspace }}\artifacts\${{ matrix.platform }}\
          -p:PublishSingleFile=true
          -p:AppPublishSingleFile=true
          -p:UseAppHost=true
          -p:SelfContained=true
          -p:WindowsAppSDKSelfContained=true
          -p:PublishTrimmed=false
          -p:AppxPackageSigningEnabled=false
          -t:Publish
          src/AudioDeviceSwitcher/AudioDeviceSwitcher.csproj

      - name: Package EXE
        shell: pwsh
        run: |
          $outputDir = "artifacts/${{ matrix.platform }}"
          $exe = Join-Path $outputDir "AudioDeviceSwitcher.exe"
          if (-not (Test-Path $exe)) {
            Get-ChildItem $outputDir -Recurse | Select-Object FullName
            throw "AudioDeviceSwitcher.exe not found in $outputDir"
          }
          New-Item dist -ItemType Directory -Force | Out-Null
          $zip = "dist/AudioDeviceSwitcher-${{ matrix.platform }}-v$env:ARTIFACT_VERSION.zip"
          Compress-Archive -Path "$outputDir/*" -DestinationPath $zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AudioDeviceSwitcher-${{ matrix.platform }}
          path: dist/*.zip

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          draft: true
