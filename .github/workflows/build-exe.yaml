name: Build EXE

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [x64, arm64]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Windows SDK
        uses: GuillaumeFalourd/setup-windows10-sdk-action@v1
        with:
          sdk-version: 18362

      - name: Install Nerdbank.GitVersioning
        shell: pwsh
        run: |
          dotnet tool install -g nbgv
          $toolPath = "$env:USERPROFILE\.dotnet\tools"
          echo "$toolPath" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8

      - name: Generate version
        shell: pwsh
        run: |
          $simpleVersion = & nbgv get-version -v SimpleVersion
          $nugetVersion = & nbgv get-version -v NuGetPackageVersion
          $assemblyVersion = & nbgv get-version -v AssemblyVersion
          $fileVersion = & nbgv get-version -v AssemblyFileVersion
          $infoVersion = & nbgv get-version -v InformationalVersion
          echo "NBGV_SimpleVersion=$simpleVersion" >> $env:GITHUB_ENV
          echo "NBGV_version=$nugetVersion" >> $env:GITHUB_ENV
          echo "NBGV_AssemblyVersion=$assemblyVersion" >> $env:GITHUB_ENV
          echo "NBGV_AssemblyFileVersion=$fileVersion" >> $env:GITHUB_ENV
          echo "NBGV_AssemblyInformationalVersion=$infoVersion" >> $env:GITHUB_ENV
          Write-Host "Version: $simpleVersion"

      - name: Restore
        run: msbuild -v:m -nologo -p:Configuration=Release -p:Platform=${{ matrix.platform }} -t:restore

      - name: Build
        run: >
          msbuild -v:m -nologo
          -p:Configuration=Release
          -p:Platform=${{ matrix.platform }}
          -p:PublishSingleFile=true
          -p:SelfContained=true
          -p:WindowsAppSDKSelfContained=true
          -p:RuntimeIdentifier=win10-${{ matrix.platform }}
          -p:PublishTrimmed=false
          -p:AppxPackageSigningEnabled=false
          src/AudioDeviceSwitcher/AudioDeviceSwitcher.csproj

      - name: Find EXE
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "src/AudioDeviceSwitcher/bin" -Recurse -Filter "AudioDeviceSwitcher.exe" |
            Select-Object -First 1
          if (-not $exe) {
            Write-Error "EXE not found"
            exit 1
          }
          Write-Host "Found EXE: $($exe.FullName)"
          $outDir = "release/${{ matrix.platform }}"
          New-Item -ItemType Directory -Force -Path $outDir
          Copy-Item -Path $exe.DirectoryName -Destination $outDir -Recurse -Force
          echo "EXE_PATH=$outDir" >> $env:GITHUB_ENV

      - name: Create ZIP
        shell: pwsh
        run: |
          $version = "${{ env.NBGV_SimpleVersion }}" -replace '\.', '-'
          $zipName = "AudioDeviceSwitcher-${{ matrix.platform }}-v${version}.zip"
          Compress-Archive -Path "${{ env.EXE_PATH }}/*" -DestinationPath "dist/$zipName"
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AudioDeviceSwitcher-${{ matrix.platform }}
          path: dist/*.zip

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
