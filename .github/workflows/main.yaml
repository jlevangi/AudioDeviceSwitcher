name: CI

on: [push, pull_request]

jobs:
  build:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository

    runs-on: windows-latest

    env:
      PLATFORM: x64
      CONFIGURATION: Release

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - uses: GuillaumeFalourd/setup-windows10-sdk-action@v1
        with:
          sdk-version: 18362

      - name: Create Certificate
        env:
          CERTIFICATE: ${{ secrets.CERTIFICATE }}
        run: ./build create-certificate

      - name: Install Nerdbank.GitVersioning
        shell: pwsh
        run: |
          dotnet tool install -g nbgv
          $toolPath = "$env:USERPROFILE\.dotnet\tools"
          echo "$toolPath" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8

      - name: Generate version
        shell: pwsh
        run: |
          $simpleVersion = & nbgv get-version -v SimpleVersion
          $nugetVersion = & nbgv get-version -v NuGetPackageVersion
          $assemblyVersion = & nbgv get-version -v AssemblyVersion
          $fileVersion = & nbgv get-version -v AssemblyFileVersion
          $infoVersion = & nbgv get-version -v InformationalVersion
          echo "NBGV_SimpleVersion=$simpleVersion" >> $env:GITHUB_ENV
          echo "NBGV_version=$nugetVersion" >> $env:GITHUB_ENV
          echo "NBGV_AssemblyVersion=$assemblyVersion" >> $env:GITHUB_ENV
          echo "NBGV_AssemblyFileVersion=$fileVersion" >> $env:GITHUB_ENV
          echo "NBGV_AssemblyInformationalVersion=$infoVersion" >> $env:GITHUB_ENV
          Write-Host "Version: $simpleVersion"

      - name: Write version
        run: ./build set-package-version

      - name: Install Audio Devices
        run: ./build install-audio-devices

      - name: Restore
        run: ./build restore

      - name: Test
        run: ./build test

      - name: Build Package
        run: ./build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AudioDeviceSwitcher ${{ env.NBGV_version }}
          path: AppPackages/AudioDeviceSwitcher (Package)_${{ env.NBGV_SimpleVersion }}.0_Test/*.msixbundle

      - name: Upload certificate
        uses: actions/upload-artifact@v4
        with:
          name: Certificate
          path: AppPackages/AudioDeviceSwitcher (Package)_${{ env.NBGV_SimpleVersion }}.0_Test/*.cer

      - name: Remove _Test folder
        run: Remove-Item AppPackages/*_Test -Recurse

      - name: Upload bundle for ms store
        uses: actions/upload-artifact@v4
        with:
          name: Upload
          path: AppPackages/*.msixupload

      - name: Publish to Windows Store
        uses: isaacrlevin/windows-store-action@1.0
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          tenant-id: ${{ secrets.AZURE_AD_TENANT_ID }}
          client-id: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          client-secret: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          app-id: ${{ secrets.STORE_APP_ID }}
          package-path: "AppPackages"
